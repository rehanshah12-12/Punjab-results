<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot - Punjab Results</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #0a192f; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .chat-container { max-width: 700px; width: 100%; background: #141b2b; border-radius: 20px; box-shadow: 0 20px 60px rgba(0,0,0,0.6); overflow: hidden; }
        .chat-header { background: #1a237e; padding: 20px; text-align: center; border-bottom: 3px solid #ff9800; }
        .chat-header h1 { color: white; font-size: 22px; }
        .chat-header p { color: #aaa; font-size: 13px; margin-top: 4px; }
        .chat-messages { height: 450px; overflow-y: auto; padding: 20px; background: #0a0e1a; }
        .message { margin-bottom: 15px; display: flex; flex-direction: column; max-width: 85%; }
        .message.user { align-self: flex-end; align-items: flex-end; }
        .message.bot { align-self: flex-start; align-items: flex-start; }
        .message .bubble { padding: 12px 18px; border-radius: 16px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
        .message.user .bubble { background: #ff9800; color: #0a192f; border-bottom-right-radius: 4px; }
        .message.bot .bubble { background: #1a237e; color: white; border-bottom-left-radius: 4px; }
        .message .time { font-size: 11px; color: #666; margin-top: 4px; padding: 0 5px; }
        .input-area { display: flex; gap: 10px; padding: 15px 20px 20px; background: #141b2b; border-top: 1px solid #1a237e; }
        .input-area input { flex: 1; padding: 14px 18px; border: none; border-radius: 30px; background: #0a0e1a; color: white; font-size: 15px; outline: none; border: 1px solid #1a237e; }
        .input-area input::placeholder { color: #666; }
        .input-area button { padding: 14px 30px; background: #ff9800; color: #0a192f; border: none; border-radius: 30px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .input-area button:hover { background: #ffb74d; transform: scale(1.02); }
        .input-area button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        @media (max-width: 600px) {
            .chat-messages { height: 350px; padding: 15px; }
            .input-area input { font-size: 14px; padding: 12px 16px; }
            .input-area button { padding: 12px 20px; font-size: 14px; }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        <h1>🤖 Punjab AI Assistant</h1>
        <p>Ask me anything about results, exams, or education!</p>
    </div>

    <div class="chat-messages" id="chatMessages">
        <div class="message bot">
            <div class="bubble">👋 Assalam-o-Alaikum! Main AI Assistant hoon. Apni board result ya koi bhi sawal poochh sakte hain!</div>
            <span class="time">Just now</span>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="userInput" placeholder="Type your message..." />
        <button id="sendBtn">➤ Send</button>
    </div>
</div>

<script>
    // ===================== 🔑 YAHAN API KEY PASTE KARO 🔑 =====================
    const API_KEY = "YOUR_GEMINI_API_KEY"; part1  // AQ.Ab8RN6IHpm // part2_i5AAP4yWu5yaAtXtZThsbLF5yGXND1v21HO-JUw
    
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    
    // ===================== DOM ELEMENTS =====================
    const chatMessages = document.getElementById('chatMessages');
    const userInput = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    
    function addMessage(text, sender, time = new Date()) {
        const div = document.createElement('div');
        div.className = `message ${sender}`;
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = text;
        const timeSpan = document.createElement('span');
        timeSpan.className = 'time';
        timeSpan.textContent = time.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        div.appendChild(bubble);
        div.appendChild(timeSpan);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function showTyping() {
        const div = document.createElement('div');
        div.className = 'message bot';
        div.id = 'typingIndicator';
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.textContent = '🤔 Thinking...';
        div.appendChild(bubble);
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }
    
    function removeTyping() {
        const typing = document.getElementById('typingIndicator');
        if (typing) typing.remove();
    }
    
    async function getAIResponse(userMessage) {
        const payload = {
            contents: [{ parts: [{ text: userMessage }] }]
        };
        
        try {
            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            
            if (!response.ok) {
                const errorData = await response.json();
                throw new Error(errorData.error?.message || 'API request failed');
            }
            
            const data = await response.json();
            const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || 
                           'Maaf karo, mujhe samajh nahi aaya. Dobara poochho!';
            return aiText;
        } catch (error) {
            console.error('Error:', error);
            return '❌ Error: ' + error.message;
        }
    }
    
    async function handleSend() {
        const message = userInput.value.trim();
        if (!message) return;
        
        sendBtn.disabled = true;
        userInput.disabled = true;
        
        addMessage(message, 'user');
        userInput.value = '';
        
        showTyping();
        
        const aiReply = await getAIResponse(message);
        
        removeTyping();
        addMessage(aiReply, 'bot');
        
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
    }
    
    sendBtn.addEventListener('click', handleSend);
    userInput.addEventListener('keypress', function(e) {
        if (e.key === 'Enter' && !sendBtn.disabled) {
            handleSend();
        }
    });
</script>

</body>
</html>
