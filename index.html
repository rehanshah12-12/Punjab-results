<!DOCTYPE html>
<html lang="ur">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Punjab Board Results 2026 - 9th & 10th Class</title>
    <!-- Font Awesome for WhatsApp Icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', Tahoma, sans-serif; }
        body { background: #f4f7fc; }
        
        /* --- TOP NAVBAR --- */
        .top-bar { background: #0a192f; color: white; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; }
        .top-bar .logo { font-size: 22px; font-weight: bold; color: #ff9800; }
        .top-bar .logo span { color: white; }
        .top-bar .nav-links a { color: #ddd; text-decoration: none; margin-left: 20px; font-size: 14px; transition: 0.3s; }
        .top-bar .nav-links a:hover { color: #ff9800; }
        
        /* --- HERO / SEARCH SECTION --- */
        .hero { background: linear-gradient(135deg, #0a192f 0%, #1a237e 100%); color: white; padding: 40px 20px; text-align: center; }
        .hero h1 { font-size: 32px; margin-bottom: 5px; }
        .hero p { opacity: 0.8; margin-bottom: 20px; }
        .search-box { background: rgba(255,255,255,0.1); backdrop-filter: blur(10px); padding: 25px; border-radius: 16px; max-width: 700px; margin: 0 auto; display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; border: 1px solid rgba(255,255,255,0.2); }
        .search-box select, .search-box input { padding: 14px 18px; border-radius: 10px; border: none; font-size: 16px; min-width: 180px; flex: 1; }
        .search-box button { padding: 14px 40px; background: #ff9800; color: #0a192f; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .search-box button:hover { background: #ffb74d; transform: scale(1.02); }

        /* --- MAIN CONTENT (2 Columns) --- */
        .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: flex; flex-wrap: wrap; gap: 30px; }
        .main-content { flex: 2; min-width: 300px; }
        .sidebar { flex: 1; min-width: 250px; }

        /* --- BLOG POSTS --- */
        .post-card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 25px; border-left: 5px solid #1a237e; transition: 0.3s; }
        .post-card:hover { box-shadow: 0 8px 25px rgba(0,0,0,0.1); transform: translateY(-3px); }
        .post-card h2 { font-size: 22px; color: #0a192f; margin-bottom: 8px; }
        .post-card h2 a { color: #0a192f; text-decoration: none; }
        .post-card .meta { font-size: 13px; color: #777; margin-bottom: 12px; }
        .post-card .meta i { margin-right: 5px; }
        .post-card p { color: #444; line-height: 1.7; margin-bottom: 12px; }
        .post-card .tags { font-size: 13px; color: #1a237e; }
        .post-card .tags i { margin-right: 5px; }
        .read-more { color: #ff9800; font-weight: bold; text-decoration: none; }

        /* --- SIDEBAR WIDGETS --- */
        .widget { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); margin-bottom: 25px; }
        .widget h3 { color: #0a192f; border-bottom: 3px solid #ff9800; padding-bottom: 10px; margin-bottom: 15px; font-size: 18px; }
        .widget ul { list-style: none; }
        .widget ul li { margin-bottom: 10px; }
